# ──────────────────────────────────────────────────────────────────────────────
# ir_alarm.ini — Sequence configuration for ir_alarm.py
# ──────────────────────────────────────────────────────────────────────────────
#
# This file defines trigger words and the sequences of IR commands that
# should be sent when each word is used. It is read by ir_alarm.py at
# startup. Changes take effect immediately the next time ir_alarm.py runs —
# no restart or recompile is needed.
#
# The file must be named ir_alarm.ini and placed in the same directory as
# ir_alarm.py.
#
# ──────────────────────────────────────────────────────────────────────────────
# IMPORTANT: Do not place comments at the end of value lines.
# Comments must always be on their own line beginning with #.
# A comment after a value will be treated as part of the value and will
# cause errors or unexpected behaviour.
# ──────────────────────────────────────────────────────────────────────────────
#
# ──────────────────────────────────────────────────────────────────────────────
# [settings] section
# ──────────────────────────────────────────────────────────────────────────────
#
# file
#   The name of the mapping file produced by ir_learn.py. Can be a plain
#   filename (resolved relative to the script directory) or a full path.
#
# default_pause
#   Milliseconds to wait after each button step. Also applied as a boundary
#   pause between pre and steps, between repetitions of steps, and between
#   the last repetition and post. This gives the receiving device time to
#   process one command before the next arrives. Explicit pause:<ms> steps
#   can be used inside any block to override this for specific gaps.
#
# ──────────────────────────────────────────────────────────────────────────────
# Trigger word sections
# ──────────────────────────────────────────────────────────────────────────────
#
# Each section other than [settings] defines a trigger word. The section
# name becomes the word passed to ir_alarm.py on the command line, and is
# matched case-insensitively.
#
# Each section may contain any combination of these four keys:
#
# pre
#   Steps to execute once before the repeated block. Use this for setup
#   commands that only need to happen once, such as powering the device on
#   or switching to the correct input.
#   Supports the same step syntax as the steps key (see below).
#   Optional — omit if no setup steps are needed.
#
# steps
#   The main block of steps to execute. This block is repeated according
#   to the repetitions key. If repetitions is omitted it runs once.
#   Supports the same step syntax described below.
#   Optional — a section can consist of only pre and post if needed.
#
# repetitions
#   How many times to run the steps block. Must be a positive integer.
#   Defaults to 1 if omitted. A default_pause gap is inserted between
#   each repetition, and also after the last repetition if a post block
#   follows.
#
# post
#   Steps to execute once after all repetitions of the steps block have
#   finished. Use this for teardown commands such as powering the device
#   off or resetting to a default state.
#   Supports the same step syntax as the steps key (see below).
#   Optional — omit if no teardown steps are needed.
#
# ──────────────────────────────────────────────────────────────────────────────
# Step syntax
# ──────────────────────────────────────────────────────────────────────────────
#
# Steps are comma-separated. Whitespace around commas is ignored. The same
# step syntax applies inside pre, steps, and post.
#
# Button step
#   Write the button name as recorded by ir_learn.py. Matched
#   case-insensitively. A default_pause gap is applied after the send.
#   Example:  on
#   Example:  POWER
#
# Pause step
#   Syntax:  pause:<milliseconds>
#   Waits for the given number of milliseconds. Use for delays that need
#   to be longer than default_pause, for example waiting for a projector
#   to finish warming up before sending further commands.
#   Example:  pause:1000
#
# Repeat step
#   Syntax:  repeat:<count>:<button>
#   Sends the named button the given number of times, with default_pause
#   between each repetition. Useful for incrementing a value (volume, speed,
#   brightness) without listing the same button many times.
#   Example:  repeat:10:vol_up
#
# A button name not found in the mapping file produces a warning and is
# skipped. The rest of the sequence continues normally.
#
# ──────────────────────────────────────────────────────────────────────────────


[settings]
file          = myremote.txt
default_pause = 24


# ──────────────────────────────────────────────────────────────────────────────
# Example sequences
#
# Edit button names to match what you recorded with ir_learn.py.
# Add or remove sections freely. Each section name becomes a trigger word.
# ──────────────────────────────────────────────────────────────────────────────


# Power the device on, then cycle through a colour sequence 12 times,
# then power it off. The pre and post blocks run once each; the steps
# block repeats for the number of repetitions specified.
[brand]
pre         = off, pause:800
steps       = on, pause:800, off, pause:800, on, pause:800, off, pause:800, on, pause:800, off, pause:2400
repetitions = 3
post        = on, r1, lower

[trafikolycka]
pre         = on, lower, b3, pause:300
steps       = b2, pause:2000, white, pause:12, b0, pause:400, white, pause:12
repetitions = 8
post        = b3, lower

[inbrottslarm]
pre         = on, lower, lower, lower
steps       = g4, pause:2000, r4, pause:800
repetitions = 6
post        = b2, lower

[röklukt]
pre         = on, lower, lower, lower
steps       = r1, pause:1200, r2, pause:1200, r3, pause:1200
repetitions = 4
post        = white, lower

[rökutveckling]
pre         = on, lower, lower, lower
steps       = r1, pause:1200, r2, pause:1200, r3, pause:1200
repetitions = 4
post        = white, lower

[explosion]
pre         = on, lower, lower, r4, pause:400, r3, pause:400, r2, pause:400, r1, pause:400, off, on
steps       = r0, pause:20, r3, pause:20, r0, pause:20, r2, pause:20, r1, pause:20
repetitions = 64
post        = on, flash, lower

[ivpa]
pre         = on, lower, lower, lower
steps       = r0, pause:1000, b0, pause:1000
repetitions = 6
post        = g2, lower

[sjukvårdslarm]
pre         = on, lower, lower, lower
steps       = r0, pause:1000, b0, pause:1000
repetitions = 6
post        = g2, lower

[resurslarm]
pre         = on, lower, lower, lower
steps       = white, pause:1600, b1, pause:1600
repetitions = 6
post        = g1, lower

[OSPAL-SILENT]
pre         = off, pause:1000
steps       = on, pause:12, off, pause:3200, on, pause:12, off, pause:12, on, pause:12, off, pause:3200
repetitions = 24
post        = off


# Turn the device on and set a dim warm scene. No repetition needed here
# so the steps key is used on its own without pre, repetitions, or post.
[reset]
steps = off, pause:200, on, lower, lower, g0


# Flash the device on and off as an alarm signal, then leave it on.
# The steps block runs 6 times to create the flashing effect.
# Post leaves the device in the on state after the alarm finishes.
[flash]
pre         = on
steps       = on, white, pause:300, off, pause:100
repetitions = 6
post        = on


# Send a single off command. No repetition, no pre or post needed.
[off]
steps = off

[on]
steps = on

# Cycle through red, green, and blue with a pause between each colour,
# repeat the cycle 3 times, then turn off.
[rainbow]
pre         = on, lower, lower, lower
steps       = r0, pause:400, g0, pause:400, b0, pause:400
repetitions = 3
post        = off
